name: Build abstracts from LaTeX
on:
  push:
    paths:
      - 'abstracts/**'
      - 'scripts/build_abstracts.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y pandoc
      - run: python scripts/build_abstracts.py
      - name: Commit generated abstract pages
        run: |
          if ! git diff --quiet -- abstracts.html abstracts/; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add abstracts.html abstracts/*.html
            git commit -m 'Generate abstract pages'
            git push
          fi
